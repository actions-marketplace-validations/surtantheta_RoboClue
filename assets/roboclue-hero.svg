<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title description">
  <title id="title">RoboClue — catch silent robot-learning pipeline errors</title>
  <desc id="description">An illustrative three-stage summary of the controlled native GR00T proof: wrong targets train for two steps; RoboClue blocks consumption; the correction passes the original criterion and trains for two steps. This is not a terminal screenshot or a robot-success result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1725"/><stop offset="1" stop-color="#142e3d"/></linearGradient>
  </defs>
  <rect width="1120" height="390" rx="20" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="58" fill="#7de2c5" font-size="15" letter-spacing="3">ROBOCLUE</text>
    <text x="48" y="108" fill="#f0f6fc" font-size="34" font-weight="700">The batch loads. The targets can still be wrong.</text>
    <text x="48" y="143" fill="#b5c8d7" font-size="18">Find the contradiction. Keep the criterion. Verify the correction.</text>
    <rect x="48" y="184" width="318" height="139" rx="12" fill="#1c2b3a" stroke="#405467"/>
    <rect x="401" y="184" width="318" height="139" rx="12" fill="#25302f" stroke="#e5b46d"/>
    <rect x="754" y="184" width="318" height="139" rx="12" fill="#163b38" stroke="#7de2c5"/>
    <text x="70" y="216" fill="#c2d3df" font-size="14">01 / NATIVE PIPELINE</text>
    <text x="70" y="251" fill="#f0f6fc" font-size="23" font-weight="700">Wrong targets accepted</text>
    <text x="70" y="289" fill="#b5c8d7" font-size="17">2 optimizer steps</text>
    <text x="423" y="216" fill="#f1ce9a" font-size="14">02 / ROBOCLUE ATTACHED</text>
    <text x="423" y="251" fill="#f0f6fc" font-size="23" font-weight="700">Contradiction caught</text>
    <text x="423" y="289" fill="#f1ce9a" font-size="17">0 forwards / 0 optimizer steps</text>
    <text x="776" y="216" fill="#7de2c5" font-size="14">03 / SAME CRITERION</text>
    <text x="776" y="251" fill="#f0f6fc" font-size="23" font-weight="700">Correction verified</text>
    <text x="776" y="289" fill="#a6eddb" font-size="17">2 optimizer steps</text>
    <text x="48" y="359" fill="#a3b8c9" font-size="14">Controlled GR00T proof · Public simulation-derived data · Bounded input preservation, not robot competence</text>
  </g>
</svg>
