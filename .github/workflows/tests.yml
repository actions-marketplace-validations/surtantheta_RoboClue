name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            dependencies: current
            umask: '022'
          - python: '3.12'
            dependencies: current
            umask: '022'
          - python: '3.11'
            dependencies: minimum
            umask: '022'
          - python: '3.12'
            dependencies: current
            umask: '077'
    steps:
      - name: Set isolated build directory
        run: echo "CI_DIST_DIR=$RUNNER_TEMP/policy-doctor-dist" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install -c constraints/minimum.txt -e '.[dev]' build
      - if: matrix.dependencies == 'current'
        run: python -m pip install -e '.[dev]' build
      - run: python -m ruff check src tests examples scripts
      - name: Run the full suite with the selected umask
        shell: bash
        run: |
          umask "${{ matrix.umask }}"
          python scripts/test_project.py --python "$(command -v python)" -- -q --junitxml=test-results.xml
      - run: python scripts/validate_demo.py
      - run: python examples/create_incident_showcase.py "${{ runner.temp }}/incident-showcase"
      - run: python examples/create_controller_showcase.py "${{ runner.temp }}/controller-showcase"
      - run: python scripts/fetch_controller_reference.py "${{ runner.temp }}/controller-reference/trajectory.cpp"
      - run: python scripts/validate_controller_reference.py --source "${{ runner.temp }}/controller-reference/trajectory.cpp" --check-implementation --output controller-reference.json
      - run: python scripts/validate_external_cases.py --work "${{ runner.temp }}/community-cases" --output external-cases.json
      - name: Build fresh distributions outside archived dist files
        run: python -m build --outdir "$CI_DIST_DIR"
      - name: Select the single freshly built wheel
        shell: bash
        run: |
          wheels=("$CI_DIST_DIR"/*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "Expected exactly one newly built wheel in $CI_DIST_DIR" >&2
            exit 1
          fi
          echo "CI_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
      - name: Install wheel without editable source
        run: python -m pip install --no-deps --force-reinstall "$CI_WHEEL"
      - name: Exercise installed CLI and MCP outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --output "$GITHUB_WORKSPACE/wheel-smoke.json"
      - name: Exercise installed metadata front door and opt-in MCP
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_check.py" --mcp --output "$GITHUB_WORKSPACE/check-smoke.json"
      - name: Exercise installed retained checks and opt-in MCP creation
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_retained.py" --mcp --output "$GITHUB_WORKSPACE/retained-smoke.json"
      - name: Exercise installed canonical product workflow and small MCP catalog
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_product.py" --mcp --output "$GITHUB_WORKSPACE/product-smoke.json"
      - name: Exercise installed downstream automation from a separate consumer
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_automation.py" --output "$GITHUB_WORKSPACE/automation-smoke.json"
      - name: Exercise installed big-bet workflows and real MCP stdio
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          wheel_sha=$(sha256sum "$CI_WHEEL" | cut -d ' ' -f 1)
          installed_prefix=$(python -c 'import sys; print(sys.prefix)')
          python "$GITHUB_WORKSPACE/scripts/smoke_big_bets_installed.py" \
            --wheel "$CI_WHEEL" --wheel-sha256 "$wheel_sha" \
            --expected-prefix "$installed_prefix" --with-mcp \
            --output "$GITHUB_WORKSPACE/big-bets-smoke.json" \
            --work-dir "$RUNNER_TEMP/big-bets-smoke"
      - name: Exercise wheel with core dependencies only
        run: |
          python -m venv "${{ runner.temp }}/core-only"
          "${{ runner.temp }}/core-only/bin/python" -m pip install "$CI_WHEEL"
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/core-only/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_onboarding.py" --output "$GITHUB_WORKSPACE/onboarding-smoke.json"
          "${{ runner.temp }}/core-only/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_product.py" --output "$GITHUB_WORKSPACE/core-product-smoke.json"
          "${{ runner.temp }}/core-only/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_check.py" --output "$GITHUB_WORKSPACE/core-check-smoke.json"
          "${{ runner.temp }}/core-only/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_retained.py" --output "$GITHUB_WORKSPACE/core-retained-smoke.json"
          "${{ runner.temp }}/core-only/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_automation.py" --output "$GITHUB_WORKSPACE/core-automation-smoke.json"
          wheel_sha=$(sha256sum "$CI_WHEEL" | cut -d ' ' -f 1)
          "${{ runner.temp }}/core-only/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_big_bets_installed.py" \
            --wheel "$CI_WHEEL" --wheel-sha256 "$wheel_sha" \
            --expected-prefix "${{ runner.temp }}/core-only" --without-mcp \
            --output "$GITHUB_WORKSPACE/core-big-bets-smoke.json" \
            --work-dir "$RUNNER_TEMP/core-big-bets-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.python }}-${{ matrix.dependencies }}-umask${{ matrix.umask }}
          path: |
            test-results.xml
            wheel-smoke.json
            onboarding-smoke.json
            check-smoke.json
            core-check-smoke.json
            retained-smoke.json
            core-retained-smoke.json
            big-bets-smoke.json
            core-big-bets-smoke.json
            product-smoke.json
            core-product-smoke.json
            automation-smoke.json
            core-automation-smoke.json
            external-cases.json
            controller-reference.json
            ${{ env.CI_DIST_DIR }}/
