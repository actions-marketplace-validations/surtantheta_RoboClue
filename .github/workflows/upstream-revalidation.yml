name: upstream compatibility review
'on':
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/upstream-revalidation.yml'
      - 'scripts/revalidate_upstream.py'
      - 'tests/test_upstream_revalidation.py'
      - 'src/policy_doctor/framework_versions.py'
      - 'src/policy_doctor/rule_catalog.py'
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  portable-regressions:
    name: Portable adapter and diagnostic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install this reviewed source
        run: python -m pip install '.[dev]'
      - name: Re-run portable adapter and diagnostic regressions
        run: >-
          python -m pytest -q
          tests/test_lerobot_training_guard.py
          tests/test_groot_training_guard.py
          tests/test_openpi_training_guard.py
          tests/test_sim_guards.py
          tests/test_salvage.py
          tests/test_downstream_automation.py
          tests/test_upstream_revalidation.py
          tests/test_rule_catalog.py
          tests/test_framework_versions.py
          --junitxml=upstream-contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-portable-contracts
          path: upstream-contracts.xml
  upstream-source-monitor:
    name: Upstream source observations (review alerts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install this reviewed source
        run: python -m pip install .
      - name: Observe upstream source drift without certifying new releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/revalidate_upstream.py --fetch --github-actions --output upstream-observations.json
      - name: Explain the qualification boundary
        if: always()
        run: |
          printf '%s\n' 'This job does not run native GPU trainers or qualify a new framework release. Known source changes produce review warnings; unavailable source identities fail this monitor. Existing support remains limited to the recorded qualification evidence.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-source-observations
          path: upstream-observations.json
